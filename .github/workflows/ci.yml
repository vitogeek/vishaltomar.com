name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec astro check

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Preview so the draft sample study is in the static output.
        run: pnpm run build
        env:
          VERCEL_ENV: preview

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Print Lighthouse scores
        if: always()
        run: node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(
            readFileSync(".lighthouseci/manifest.json", "utf8")
          );
          const byUrl = new Map();
          for (const entry of manifest) {
            const runs = byUrl.get(entry.url) ?? [];
            runs.push(entry.summary);
            byUrl.set(entry.url, runs);
          }
          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.floor((sorted.length - 1) / 2)];
          };
          const keys = [
            "performance",
            "accessibility",
            "best-practices",
            "seo",
          ];
          for (const [url, runs] of byUrl) {
            const scores = keys.map(
              (key) => `${key}=${median(runs.map((run) => run[key]))}`
            );
            console.log(`${new URL(url).pathname} ${scores.join(" ")}`);
          }
        '
